<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="hero">
      <div class="container">
        <h1>Your Name</h1>
        <p>Web developer building simple, useful things.</p>
      </div>
    </header>

    <main class="container">
      <section id="about">
        <h2>About</h2>
        <p>Write a short introduction about yourself here.</p>
      </section>

      <section id="projects">
        <h2>Projects</h2>
        <ul>
          <li>Project One</li>
          <li>Project Two</li>
          <li>Project Three</li>
        </ul>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <p>Email: you@example.com</p>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; <span id="year"></span> Your Name</p>
      </div>
    </footer>

    <script src="js/script.js" defer></script>
  </body>
</html>
